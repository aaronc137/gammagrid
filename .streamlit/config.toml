# Streamlit 读的那份主题与服务设置 —— morning-bites 定制版。
#
# 颜色是 morning-bites 站点的暗色 token(templates/_theme_head.html.j2, 2026-09-08 那组; app/theme.py 里有同一组),
# 固定暗色: 全站 9-08 起默认暗, 跟随站点明暗开关是建议项, 没做。
# 服务项放这里而不是命令行: systemd 单元只剩一句 streamlit run。
[theme]
base = "dark"
primaryColor = "#3DBA7A"
backgroundColor = "#0F1114"
secondaryBackgroundColor = "#161A1F"
textColor = "#E6E4DC"
borderColor = "#2C3138"
linkColor = "#F0863A"

font = "-apple-system, 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"
headingFont = "-apple-system, 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"
codeFont = "ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"

baseFontSize = 13
headingFontSizes = ["18px", "16px", "16px", "13px", "13px", "11px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
metricValueFontSize = "28px"
metricValueFontWeight = 700

baseRadius = "4px"
buttonRadius = "4px"
dataframeBorderColor = "#2C3138"
dataframeHeaderBackgroundColor = "#272C32"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#0F1114"
borderColor = "#2C3138"

[server]
headless = true
# 只听回环: 公网入口是 cloudflared 隧道 + Access, 路径 /gamma(cloudflared 的 ingress 规则在 morning-bites 的 docs/cloud-setup.md)。
address = "127.0.0.1"
port = 8903
baseUrlPath = "gamma"

[browser]
# 默认 true 会从浏览器端上报用量; 本站零外部请求。
gatherUsageStats = false

[client]
toolbarMode = "minimal"
